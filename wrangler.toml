name = "aetheris-lab-api"
main = "worker/index.ts"
compatibility_date = "2026-11-20"
workers_dev = true
keep_vars = true

[vars]
ADMIN_ORIGIN = "https://aetheris-admin.pages.dev"

[triggers]
crons = ["* * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "aetheris-lab-db"
database_id = "81233c23-e705-42c4-add1-94a7727bc41f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "aetheris-lab-private-images"

[[ratelimits]]
name = "SUBMISSION_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "TRACKING_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
