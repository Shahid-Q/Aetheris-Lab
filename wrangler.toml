name = "aetheris-lab-api"
main = "worker/index.ts"
compatibility_date = "2026-11-20"
workers_dev = true
keep_vars = true

[vars]
ADMIN_ORIGIN = "https://aetheris-admin.pages.dev"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "aetheris-lab-db"
database_id = "3118d17b-340c-4fd0-8877-7bcd67983aa6"
migrations_dir = "migrations"


# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "aetheris-lab-private-images"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[ratelimits]]
name = "SUBMISSION_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "TRACKING_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }